<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AskMyNotes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffffff, #eefcff);
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        /* Heading */
        h1 {
            text-align: center;
            font-size: 42px;
            color: #176b87;
            margin-bottom: 55px;
            font-weight: 700;
        }

        /* Labels */
        label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #444;
        }

        /* File Upload */
        .upload-section {
            margin-bottom: 35px;
        }

        .file-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            background: white;
            cursor: pointer;
        }

        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #777;
        }

        /* Question */
        .question-section {
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 15px;
            border: 1px solid #d6d6d6;
            border-radius: 7px;
            font-size: 16px;
            resize: vertical;
            outline: none;
            background: #fff;
        }

        textarea:focus {
            border-color: #16849e;
            box-shadow: 0 0 5px rgba(22, 132, 158, 0.15);
        }

        /* Button */
        .button-container {
            text-align: center;
            margin: 25px 0 55px;
        }

        button {
            background: #16849e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #106b80;
        }

        button:disabled {
            background: #9bbdc5;
            cursor: not-allowed;
        }

        /* Answer */
        .answer-section {
            margin-top: 20px;
        }

        .answer-box {
            min-height: 80px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #ffffff;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #16849e;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AskMyNotes</h1>

        <!-- PDF Upload -->
        <div class="upload-section">

            <label for="pdfFile">
                Upload your notes (PDF)
            </label>

            <input
                type="file"
                id="pdfFile"
                class="file-input"
                accept=".pdf"
            >

            <div class="file-name" id="fileName">
                Choose a PDF file
            </div>

        </div>


        <!-- Question -->
        <div class="question-section">

            <label for="question">
                Your question
            </label>

            <textarea
                id="question"
                placeholder="What is this?"
            ></textarea>

        </div>


        <!-- Submit -->
        <div class="button-container">

            <button id="submitBtn">
                Submit
            </button>

            <div class="loading" id="loading">
                Processing...
            </div>

        </div>


        <!-- Answer -->
        <div class="answer-section">

            <label>
                Answer
            </label>

            <div class="answer-box" id="answer">
                -
            </div>

        </div>

    </div>


    <script>

        const pdfFile = document.getElementById("pdfFile");
        const fileName = document.getElementById("fileName");

        const question = document.getElementById("question");
        const submitBtn = document.getElementById("submitBtn");

        const answer = document.getElementById("answer");
        const loading = document.getElementById("loading");


        // Show selected PDF name
        pdfFile.addEventListener("change", function () {

            if (this.files.length > 0) {

                fileName.textContent =
                    "Selected file: " + this.files[0].name;

            } else {

                fileName.textContent =
                    "Choose a PDF file";

            }

        });


        // Submit
        submitBtn.addEventListener("click", async function () {

            const file = pdfFile.files[0];
            const userQuestion = question.value.trim();


            if (!file) {
                alert("Please upload a PDF first.");
                return;
            }


            if (!userQuestion) {
                alert("Please enter your question.");
                return;
            }


            loading.style.display = "block";
            submitBtn.disabled = true;
            answer.textContent = "-";


            try {
                // Call FastAPI backend (/predict)
                const API_URL = "https://backend-model-latest-1-b38a.onrender.com/predict";

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: userQuestion })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const category = data.predicted_category || data.answer || "No category returned";
                answer.textContent = `Predicted Category: ${category}`;
            }

            catch (error) {
                console.error(error);
                answer.textContent = "Error communicating with the backend: " + error.message;
            }

            finally {

                loading.style.display = "none";
                submitBtn.disabled = false;

            }

        });

    </script>

</body>
</html>
